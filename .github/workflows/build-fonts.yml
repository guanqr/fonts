name: Build and Deploy Fonts

on:
  workflow_dispatch:
    inputs:
      updated-fonts:
        description: 'Comma-separated list of fonts to update'
        required: false
        default: 'all'
        type: string
      version-cache:
        description: 'Version cache JSON to persist after a successful build'
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**/*.py'
      - '.github/workflows/build-fonts.yml'

concurrency:
  group: fonts-build
  cancel-in-progress: false

jobs:
  build-fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Prepare font subsetter native library
        run: |
          pnpm rebuild cn-font-split
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packageJson = require.resolve('cn-font-split/package.json');
            const distDir = path.join(path.dirname(packageJson), 'dist');
            const extension = process.platform === 'win32' ? '.dll' : process.platform === 'darwin' ? '.dylib' : '.so';
            const libraries = fs.readdirSync(distDir).filter((name) => name.startsWith('libffi') && name.endsWith(extension));
            console.log('FFI libraries:', libraries.join(', ') || '(none)');
            if (libraries.length === 0) {
              console.error('cn-font-split native library is missing');
              process.exit(1);
            }
          "

      - name: Run tests
        run: pnpm test

      - name: Build fonts using CLI
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          echo "🔄 Starting font build workflow..."
          UPDATED_FONTS="${{ github.event.inputs.updated-fonts || 'all' }}"
          echo "📋 Updated fonts parameter: '$UPDATED_FONTS'"

          if [ "$UPDATED_FONTS" = "all" ] || [ -z "$UPDATED_FONTS" ]; then
            echo "🎯 Building all fonts (full build)..."
            pnpm run cli:build
          else
            echo "🎯 Building specific fonts: $UPDATED_FONTS"
            # Convert comma-separated list to space-separated for CLI
            FONT_IDS=$(echo "$UPDATED_FONTS" | tr ',' ' ')
            echo "🎯 Converted to CLI format: '$FONT_IDS'"
            pnpm run cli:build --fonts $FONT_IDS
          fi
          echo "✅ Font build completed"
      
      - name: Verify build output
        run: |
          set -eu
          echo "🔍 Checking build output..."

          for dir in build build/css build/fonts; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing directory: $dir"
              exit 1
            fi
          done

          if [ -z "$(find build/css -type f -name '*.css' -print -quit)" ]; then
            echo "❌ No CSS files generated"
            exit 1
          fi

          if [ -z "$(find build/fonts -type f -name '*.woff2' -print -quit)" ]; then
            echo "❌ No WOFF2 font files generated"
            exit 1
          fi

          echo "✅ Build output exists"
          echo "📁 Build directory contents:"
          find build -type f | sed -n '1,20p'
      
      - name: Create build metadata
        run: |
          echo "📋 Creating build metadata..."
          mkdir -p build
          
          # Create basic directory structure if it doesn't exist
          mkdir -p build/fonts
          mkdir -p build/css
          
          UPDATED_FONTS="${{ github.event.inputs.updated-fonts || 'all' }}"
          if [ "$UPDATED_FONTS" = "all" ] || [ -z "$UPDATED_FONTS" ]; then
            BUILD_TYPE="full"
            PROCESSED_FONTS="all"
          else
            BUILD_TYPE="selective"
            PROCESSED_FONTS="$UPDATED_FONTS"
          fi
          
          # Export fonts config from TypeScript to JSON
          node -e "
            import('./dist/config/fonts/index.js').then(config => {
              console.log(JSON.stringify(config.allFonts, null, 2));
            }).catch(err => {
              console.error('Error loading fonts config:', err);
              process.exit(1);
            });
          " > fonts-config.json
          
          cat > build/metadata.json << EOF
          {
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "buildId": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "buildType": "$BUILD_TYPE",
            "updatedFonts": "$UPDATED_FONTS",
            "processedFonts": "$PROCESSED_FONTS",
            "fonts": $(cat fonts-config.json)
          }
          EOF
          
          # Clean up temporary file
          rm fonts-config.json
          
          echo "✅ Build metadata created (type: $BUILD_TYPE)"
      
      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
      
      - name: Incremental deploy to build branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./build
          publish_branch: build
          keep_files: true # Keep old hashed chunks for cached CSS; cleanup-build.yml prunes after retention
          commit_message: |
            🔄 Font build ${{ github.run_id }} - ${{ steps.date.outputs.date }}
            
            Build type: ${{ github.event.inputs.updated-fonts == 'all' || github.event.inputs.updated-fonts == '' && 'Full build (all fonts)' || format('Selective build: {0}', github.event.inputs.updated-fonts) }}
            Source commit: ${{ github.sha }}
            Triggered by: ${{ github.event_name }}
      
      - name: Summary
        run: |
          echo "✅ Font build and deployment complete!"
          echo "📊 Build Summary:"
          echo "- Build ID: ${{ github.run_id }}"
          UPDATED_FONTS="${{ github.event.inputs.updated-fonts || 'all' }}"
          if [ "$UPDATED_FONTS" = "all" ] || [ -z "$UPDATED_FONTS" ]; then
            echo "- Build type: Full build (all fonts)"
          else
            echo "- Build type: Selective build"
            echo "- Updated fonts: $UPDATED_FONTS"
          fi
          echo "- Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "- Deployed to: build branch"
          
          if [ -f build/metadata.json ]; then
            echo "📋 Metadata:"
            cat build/metadata.json | jq '.'
          fi
          
          if [ -d build/fonts ]; then
            echo "📦 Generated font files:"
            ls -la build/fonts/
          fi
          
          if [ -d build/css ]; then
            echo "🎨 Generated CSS files:"
            ls -la build/css/
          fi

      - name: Update version cache after successful build
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version-cache != ''
        env:
          VERSION_CACHE: ${{ github.event.inputs.version-cache }}
        run: |
          set -eu
          echo "🔄 Updating version cache..."

          echo "$VERSION_CACHE" | jq -e 'type == "object" and ([.[] | .version | type] | all(. == "string"))' > /dev/null
          printf '%s\n' "$VERSION_CACHE" > .version-cache.json

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin cache || true
          git checkout cache 2>/dev/null || git checkout --orphan cache
          git pull origin cache || true

          # Merge with the existing cache so unrelated font entries are preserved
          if [ -f version-cache.json ]; then
            jq -s '.[0] * .[1]' version-cache.json .version-cache.json > /tmp/merged-version-cache.json
            mv /tmp/merged-version-cache.json .version-cache.json
          fi

          git rm -rf . 2>/dev/null || true

          cp .version-cache.json version-cache.json
          git add version-cache.json
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Update font version cache - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin cache
            echo "✅ Version cache committed to cache branch"
          fi
