name: Weekly Font Version Check

on:
  schedule:
    # Monday 00:00 Hong Kong time (Sunday 16:00 UTC)
    - cron: '0 16 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-updates: ${{ steps.version-check.outputs.has-updates }}
      updated-fonts: ${{ steps.version-check.outputs.updated-fonts }}
      version-cache: ${{ steps.export-cache.outputs.version-cache }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Check font versions
        id: version-check
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          # Build TypeScript first
          pnpm run build
          # Run version check using CLI
          pnpm run cli:check
      
      - name: Export version cache
        id: export-cache
        if: steps.version-check.outputs.has-updates == 'true'
        run: |
          set -eu
          if [ ! -f .version-cache.json ]; then
            echo "❌ Version cache file not found"
            exit 1
          fi

          {
            echo "version-cache<<VERSION_CACHE_EOF"
            cat .version-cache.json
            echo "VERSION_CACHE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Version cache exported for post-build commit"

  trigger-build:
    needs: check-versions
    if: needs.check-versions.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Trigger font build workflow
        uses: actions/github-script@v9
        env:
          UPDATED_FONTS: ${{ needs.check-versions.outputs.updated-fonts }}
          VERSION_CACHE: ${{ needs.check-versions.outputs.version-cache }}
        with:
          github-token: ${{ secrets.PERSONAL_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-fonts.yml',
              ref: 'main',
              inputs: {
                'updated-fonts': process.env.UPDATED_FONTS || 'all',
                'version-cache': process.env.VERSION_CACHE || ''
              }
            });
      
      - name: Notify build triggered
        run: |
          echo "✅ Font build workflow triggered for fonts: ${{ needs.check-versions.outputs.updated-fonts }}"
